<style>

.glow::before,.glow::after{content:"";position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(100px);opacity:.22;animation:dr 45s ease-in-out infinite alternate}
.glow::before{background:var(--ac);top:-20vmax;right:-15vmax}.glow::after{background:var(--ac2);bottom:-25vmax;left:-15vmax;animation-delay:-20s}

.wrap{flex:1;min-width:0}main{padding-top:18px}

.hrow{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--cell);padding:11px 14px;border-radius:14px;margin:6px 0;border-inline-start:4px solid transparent;text-align:right}.hrow.ok{border-inline-start-color:#14b8a6}.hrow span{color:var(--mut);font-size:13px}
.wb{display:flex;align-items:flex-end;gap:8px;height:100px}.wb div{flex:1;text-align:center;font-size:11px;color:var(--mut)}.wb i{display:block;border-radius:8px;background:var(--c);margin-bottom:4px;min-height:4px}
.xp{height:10px;background:var(--cell);border-radius:6px;overflow:hidden;margin:8px 0}.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:6px}
.gb{padding:18px;border-radius:18px;background:linear-gradient(160deg,var(--cell),var(--cs));border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 6px 0 color-mix(in srgb,var(--c) 55%,#000);display:flex;flex-direction:column;gap:6px;min-height:120px}
.gb b{font-size:17px;color:var(--c)}.gb span{color:var(--mut);font-size:13px}.gb em{font-style:normal;margin-top:auto;font-size:12px;background:color-mix(in srgb,var(--c) 20%,transparent);align-self:flex-start;border-radius:20px;padding:2px 10px}
.ach{opacity:.5}.ach.on{opacity:1;box-shadow:inset 0 0 0 1px #14b8a6,var(--sh)}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line)}.srow:last-child{border:0}.srow small{display:block;color:var(--mut);font-size:12px}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:46px;height:26px;border-radius:20px;background:var(--cell);position:relative;cursor:pointer;border:1px solid var(--line);flex:none}

input[type=checkbox]:checked{background:var(--ac)}input[type=checkbox]:checked::after{inset-inline-start:22px;background:#fff}
@media(max-width:700px){.glow::before,.glow::after{filter:blur(60px);will-change:transform}}
[dir=ltr] th.nm{right:auto;left:0;text-align:left}
.ph{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}.ph small{flex-basis:100%;order:3}.ph .sec{margin-inline-start:auto}
#bn{display:none}.mrow{display:flex;align-items:center;gap:14px;width:100%;background:var(--cell);border-radius:14px;padding:14px 16px;margin:6px 0;font-size:15px;text-align:start;color:var(--ink)}
.mrow svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}.mrow.on{outline:2px solid var(--ac,#7c6cf0)}
#mdlg{margin:auto auto calc(104px + env(safe-area-inset-bottom,0px));padding:14px;width:min(420px,92vw)}
@media(max-width:860px){nav{display:none}
#bn{display:flex;direction:ltr;justify-content:space-around;align-items:flex-end;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30;height:66px;padding:8px 6px;border-radius:26px;background:color-mix(in srgb,var(--cs) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:0 12px 32px rgba(0,0,0,.35)}
#bn button{flex:1;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mut);padding:4px 0}
#bn button.on{color:var(--ink);font-weight:700}

#bn .fab{flex:0 0 62px;height:62px;border-radius:50%;margin-top:-34px;padding:0;justify-content:center;color:#fff;background:linear-gradient(135deg,#14b8a6,#22c55e);box-shadow:0 8px 22px rgba(20,184,166,.5);border:4px solid var(--bg)}
#bn .fab svg{width:30px;height:30px;stroke-width:2.6}
.wrap{padding-bottom:120px}}

#bgimg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;display:none}#bgimg.on{display:block}
#bgimg::after{content:"";position:absolute;inset:0;background:rgba(10,14,28,.55)}:root[data-theme=light] #bgimg::after{background:rgba(255,255,255,.55)}
.bgs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sw{width:34px;height:34px;border-radius:50%;border:2px solid transparent}.sw.on{border-color:var(--ink)}.upl{cursor:pointer;padding:8px 12px;border-radius:12px}
button.gb{text-align:start;font:inherit;color:inherit;width:100%;cursor:pointer}
</style></head><body>
<div id="bgimg"></div><canvas id="bg"></canvas><div id="toast" role="status"></div><div class="glow"></div>
<div class="app"><nav id="nav" aria-label="التنقل"></nav><div class="wrap"><main id="app"></main></div></div>
<div id="bn" role="navigation"></div>
<dialog id="dlg"></dialog><dialog id="mdlg"></dialog>
<script>
const $=s=>document.querySelector(s),K='tr30v3',DAYS=['أحد','اثن','ثلا','أرب','خمي','جمع','سبت'];
const todayISO=()=>{const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')};
const fresh=()=>({start:todayISO(),view:'dash',data:{},lang:'ar',fx:true,theme:'dark',habits:['الصلاة','الجري','القراءة','التعلم','النوم','التنظيم'].map((x,i)=>({id:'h'+i,n:x,t:0,type:'good'})).concat({id:'h9',n:'Instagram',t:60,type:'limit'})});
let S=fresh(),ready=false;
const norm=()=>{S.habits=S.habits.filter(h=>h.n!='التحكم في العادة');S.start=S.start||todayISO();S.lang??='ar';S.view='dash';S.fx??=true;S.theme??='dark'};
/* تخزين متعدد الطبقات: localStorage + IndexedDB + Capacitor Preferences + جسر Android اختياري */
const idb=()=>new Promise((ok,no)=>{const q=indexedDB.open('tr30',1);q.onupgradeneeded=()=>q.result.createObjectStore('s');q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});
const idbGet=()=>idb().then(d=>new Promise((ok,no)=>{const q=d.transaction('s').objectStore('s').get(K);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)}));
const idbSet=v=>idb().then(d=>new Promise((ok,no)=>{const t=d.transaction('s','readwrite');t.objectStore('s').put(v,K);t.oncomplete=ok;t.onerror=()=>no(t.error)}));
const capP=()=>window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Preferences;
function save(){if(!ready)return;S._t=Date.now();const j=JSON.stringify(S);
 try{localStorage.setItem(K,j)}catch(e){}
 try{idbSet(j).catch(()=>{})}catch(e){}
 try{capP()&&capP().set({key:K,value:j}).catch(()=>{})}catch(e){}
 try{window.AndroidStorage&&AndroidStorage.setItem(K,j)}catch(e){}}
async function loadSaved(){const c=[];
 try{c.push(localStorage.getItem(K))}catch(e){}
 try{c.push(await idbGet())}catch(e){}
 try{capP()&&c.push((await capP().get({key:K})).value)}catch(e){}
 try{window.AndroidStorage&&c.push(AndroidStorage.getItem(K))}catch(e){}
 let best=null;for(const x of c){try{const o=JSON.parse(x);if(o&&o.habits&&(!best||(o._t||0)>(best._t||0)))best=o}catch(e){}}return best}
addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const P=x=>String(x).padStart(2,'0'),fmt=m=>m?Math.floor(m/60)+':'+P(m%60):'';
const wk=d=>Math.floor((d-1)/7),pc=x=>Math.round(x*100);
function ctx(){const[y,m,d]=S.start.split('-').map(Number),b=Date.UTC(y,m-1,d),n=new Date();
 const tod=Math.floor((Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())-b)/864e5)+1;return{b,tod,el:Math.max(0,Math.min(30,tod))}}
const cell=(h,d)=>S.data[h.id+'_'+d];
function done(h,d){const c=cell(h,d);if(!c)return false;if(h.type=='limit')return c.m<=h.t;return !!c.d||(h.t>0&&c.m>=h.t)}
const dayPct=d=>S.habits.length?S.habits.filter(h=>done(h,d)).length/S.habits.length:0;
const dayMin=d=>S.habits.reduce((a,h)=>a+(cell(h,d)?cell(h,d).m:0),0);
function avg(a,b){const{el}=ctx();b=Math.min(b,el);if(b<a)return 0;let s=0;for(let d=a;d<=b;d++)s+=dayPct(d);return s/(b-a+1)}
const ICO={dash:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',days:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/>',time:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>',stats:'<path d="M5 20V10M12 20V4M19 20v-8"/>',games:'<rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 10v5M4.5 12.5h5M16 11.5h.01M18.5 14h.01"/>',rank:'<path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H4v1a3 3 0 0 0 4 3M16 6h4v1a3 3 0 0 1-4 3M12 13v4M8 20h8"/>',profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',settings:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'};
ICO.home='<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>';ICO.plus='<path d="M12 5v14M5 12h14"/>';ICO.more='<circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/>';
const PG=[['dash','الرئيسية'],['days','30 يوم'],['time','الوقت'],['stats','الإحصائيات'],['games','ألعاب الذكاء'],['rank','الترتيب'],['profile','الملف الشخصي'],['settings','الإعدادات']];
const ring=(p,z)=>{const R=44,C=2*Math.PI*R;return `<svg width="${z}" height="${z}" viewBox="0 0 120 120"><defs><linearGradient id="rg"><stop offset="0" stop-color="#8b7cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--cell)" stroke-width="12"/><circle cx="60" cy="60" r="${R}" fill="none" stroke="url(#rg)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C*p/100} ${C}" transform="rotate(-90 60 60)"/><text x="60" y="67" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink)">${p}%</text></svg>`};
function streak(){const{tod,el}=ctx();let d=el,s=0;if(d&&dayPct(d)<.5&&d==tod)d--;while(d>=1&&dayPct(d)>=.5){s++;d--}return s}
function xp(){const{tod,el}=ctx();let n=0,t=0,pd=0;const need=Math.min(3,S.habits.length),last=Math.min(30,tod-1);
 for(let d=1;d<=30;d++){t+=dayMin(d);if(d<=el){let c=0;S.habits.forEach(h=>{if(done(h,d)){n++;c++}});if(d<=last&&c<need)pd++}}
 const pen=pd*20;return{x:Math.max(0,n*10+Math.floor(t/10)+(S.gw||0)*10-pen),t,n,pd,pen}}

function askName(){const Dg=$('#dlg'),first=!S.name;Dg.oncancel=e=>{if(!S.name)e.preventDefault()};

// --- نظام التحقق من التحديثات عن بعد ---
const APP_VERSION = 2; // رقم الإصدار الحالي
const CONFIG_URL = 'https://YOUR_USERNAME.github.io/YOUR_REPO/config.json'; // سنغير هذا لاحقاً برابطك

async function checkUpdate() {
  try {
    const res = await fetch(CONFIG_URL + '?t=' + Date.now());
    const data = await res.json();
    
    if (data.version > APP_VERSION) {
      const D = $('#dlg');
      D.innerHTML = `<h2>🚀 تحديث جديد متاح!</h2>
      <p style="color:var(--mut)">${data.message}</p>
      <div class="row">
        <button class="pri" id="btnUp">تحديث الآن</button>
        <button class="sec" id="btnLat">لاحقاً</button>
      </div>`;
      
      $('#btnUp').onclick = () => { window.location.reload(true); };
      $('#btnLat').onclick = () => D.close();
      D.showModal();
    }
  } catch (e) {
    console.log('التطبيق يعمل بدون اتصال أو الرابط غير صحيح بعد');
  }
}
setTimeout(checkUpdate, 3000);
